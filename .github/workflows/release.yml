name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build zips
        run: bash .github/scripts/build-release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          assets=("$DIST_DIR"/*.zip)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --prerelease="$([[ "$VERSION" == *-* ]] && echo true || echo false)"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
          fi
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$NOTES_FILE"

      - name: Upload to CurseForge
        if: env.CF_API_TOKEN != '' && env.CF_PROJECT_ID != ''
        run: bash .github/scripts/upload-curseforge.sh
